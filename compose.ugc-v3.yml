services:
  ugc-v3-worker:
    build:
      context: .
      dockerfile: workers/ugc-v3/Dockerfile
    env_file: .env.worker
    environment:
      NODE_ENV: production
      UGC_V3_ENABLED: "1"
      UGC_V3_ACCESS_MODE: owned
      UGC_V3_WORKER_ENABLED: "1"
      UGC_V3_RECOVERY_DIR: /data/ugc-v3
    restart: unless-stopped
    stop_grace_period: 45s
    volumes:
      - ugc-v3-recovery:/data/ugc-v3
    healthcheck:
      test: ["CMD", "node", "scripts/check-ugc-v3-worker-health.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  ugc-v3-recovery:
